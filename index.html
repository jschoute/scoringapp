<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoring App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Scoring des Combats</h1>
    
    <div class="scores">
      <!-- Combatant Rouge -->
      <div class="combatant" style="background-color: #ffcccc;">
        <h2>Rouge</h2>
        <p id="score-red">Score : 0</p>
        <button class="rectangular red-button" onclick="addScore('red', 1)">Percussion</button>
        <button class="rectangular red-button" onclick="addScore('red', 2)">Projection</button>

        <div class="sol-buttons">
          <button class="square red-button" onclick="addScore('red', 3)">Contrôle</button>
          <button class="square red-button" onclick="addScore('red', 4)">RenvT</button>
          <button class="square red-button" onclick="addScore('red', 5)">Passage de garde</button>
          <button class="square red-button" onclick="addScore('red', 6)">Montée</button>
        </div>

        <button class="rectangular yellow-button" onclick="addWarning('red')">Avertissement</button>

        <!-- Tableau des statistiques -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <table id="red-stats" class="stats-table">
            <tr>
              <td>Percussion</td>
              <td id="red-percussion-count">0</td>
              <td id="red-percussion-percent">0%</td>
            </tr>
            <tr>
              <td>Projection</td>
              <td id="red-projection-count">0</td>
              <td id="red-projection-percent">0%</td>
            </tr>
            <tr>
              <td>Sol</td>
              <td id="red-sol-count">0</td>
              <td id="red-sol-percent">0%</td>
            </tr>
            <tr>
              <td>Avertissement</td>
              <td id="red-warning-count">0</td>
              <td id="red-warning-percent">0%</td>
            </tr>
          </table>

          <!-- Bouton "Annuler le dernier point" -->
          <button class="square red-button" onclick="undoLastPoint('red')">↺</button>
        </div>
      </div>

      <!-- Combatant Bleu -->
      <div class="combatant" style="background-color: #cce0ff;">
        <h2>Bleu</h2>
        <p id="score-blue">Score : 0</p>
        <button class="rectangular blue-button" onclick="addScore('blue', 1)">Percussion</button>
        <button class="rectangular blue-button" onclick="addScore('blue', 2)">Projection</button>

        <div class="sol-buttons">
          <button class="square blue-button" onclick="addScore('blue', 3)">Contrôle</button>
          <button class="square blue-button" onclick="addScore('blue', 4)">RenvT</button>
          <button class="square blue-button" onclick="addScore('blue', 5)">Passage de garde</button>
          <button class="square blue-button" onclick="addScore('blue', 6)">Montée</button>
        </div>

        <button class="rectangular yellow-button" onclick="addWarning('blue')">Avertissement</button>

        <!-- Tableau des statistiques -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <table id="blue-stats" class="stats-table">
            <tr>
              <td>Percussion</td>
              <td id="blue-percussion-count">0</td>
              <td id="blue-percussion-percent">0%</td>
            </tr>
            <tr>
              <td>Projection</td>
              <td id="blue-projection-count">0</td>
              <td id="blue-projection-percent">0%</td>
            </tr>
            <tr>
              <td>Sol</td>
              <td id="blue-sol-count">0</td>
              <td id="blue-sol-percent">0%</td>
            </tr>
            <tr>
              <td>Avertissement</td>
              <td id="blue-warning-count">0</td>
              <td id="blue-warning-percent">0%</td>
            </tr>
          </table>

          <!-- Bouton "Annuler le dernier point" -->
          <button class="square blue-button" onclick="undoLastPoint('blue')">↺</button>
        </div>
      </div>
    </div>
    <button onclick="window.location.href='bilan.html'">BILAN SCORE</button>
    
 
    <button onclick="resetScores()">Réinitialiser</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
